[package]
name = "rosimbot-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
twilight-gateway = "0.17.1"
twilight-model = "0.17.1"
